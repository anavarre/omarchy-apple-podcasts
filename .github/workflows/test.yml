name: test

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository; the default token must not be able to
# write to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # Omarchy is Arch-based and GitHub has no Omarchy runner image, so run the
    # job in an Arch container to match the target environment.
    container: archlinux:latest
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm git python
      # Third-party actions pinned to a commit, so a moved tag cannot change
      # what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install mpv, socat and shellcheck
        run: pacman -S --noconfirm --needed mpv socat shellcheck
      - name: Lint
        run: |
          shellcheck -S warning bin/podcasts-api bin/podcasts-player tests/api.sh tests/player.sh tests/run
          python3 -m json.tool manifest.json > /dev/null
      - name: Tests
        run: CI=1 tests/run
